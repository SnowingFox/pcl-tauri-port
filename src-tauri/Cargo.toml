[package]
name = "pcl-tauri-port"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pcl_tauri_port_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net", "process"] }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
md-5 = "=0.11.0"
base64 = "=0.23.1"
thiserror = "=2.0.21"
keyring = { version = "=3.6.3", features = ["apple-native"] }
url = "=2.5.8"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "form", "rustls"] }
regex = "=1.12.3"
futures-util = "=0.3.34"
sha1 = "=0.11.0"
sha2 = "=0.11.1"
hex = "=0.4.3"
toml = "=1.1.8"
async-trait = "=0.1.92"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }
tracing-appender = "=0.2.5"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
wiremock = "=0.6.5"
tempfile = "=3.27.0"
